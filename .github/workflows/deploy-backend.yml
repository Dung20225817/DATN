name: Deploy Backend

on:
  push:
    branches: [master]
    paths:
      - "be/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy-backend.yml"

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/ocr-crnn-backend

jobs:
  build-and-push:
    name: Build & Push to DockerHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./be
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/ubuntu/ocr-crnn/"

      - name: Pull new image and restart backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/ubuntu/ocr-crnn

            # Pull image mới nhất từ DockerHub
            docker compose -f docker-compose.prod.yml pull backend

            # Restart container (giữ nguyên volume, env)
            docker compose -f docker-compose.prod.yml up -d backend

            # Chờ healthcheck pass
            echo "Waiting for backend to become healthy..."
            for i in $(seq 1 12); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' ocr-crnn-backend 2>/dev/null || echo "unknown")
              echo "  Attempt $i/12: $STATUS"
              [ "$STATUS" = "healthy" ] && break
              sleep 5
            done

            # In trạng thái cuối cùng
            docker compose -f docker-compose.prod.yml ps

            # Xóa images cũ để tiết kiệm dung lượng ổ cứng EC2
            docker image prune -f
